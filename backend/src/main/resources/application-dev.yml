spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/codeforge_db
    username: codeforge
    password: codeforge_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
